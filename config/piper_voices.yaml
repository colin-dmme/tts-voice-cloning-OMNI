# Catalog riêng cho các giọng Piper tiếng Việt. Tkinter và PySide6 cùng đọc
# qua ModelRegistry/AppController; không GUI nào chứa danh sách giọng hardcode.

x-piper-fixed: &piper-fixed
  provider: "piper"
  model_type: "tts"
  language_priority: "vi"
  required: false
  capabilities:
    supported_languages: ["vi"]
    supports_voice_profile: false
    supports_voice_presets: false
    supports_reference_text: false
    supports_speed: true
    supports_pitch_shift: false
    supports_emotion: false

x-piper-single: &piper-single
  <<: *piper-fixed
  voice_input:
    modes: ["fixed"]
    default_mode: "fixed"
    fixed_label: "Giọng Piper cố định"
    fixed_tooltip: "Model đã huấn luyện sẵn; không dùng Profile giọng hoặc audio mẫu."

x-piper-nghi: &piper-nghi
  <<: *piper-single
  hf_repo: "doof-ferb/nghitts-copy"
  notes: "Giọng Piper ONNX từ mirror NGHI-TTS, tải và gỡ độc lập."

tts_models:
