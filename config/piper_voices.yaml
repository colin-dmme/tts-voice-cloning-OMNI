    runtime:
      model_file: "model.onnx"
      config_file: "config.json"
      download_allow_patterns: ["model.onnx", "config.json"]
    notes: "Piper tiếng Việt official, một speaker, quality medium, 22.05 kHz."
    catalog_info:
      category: "official-cpu"
      origin: "official"
      family: "Piper official"
      variant: "VAIS1000 medium"
      variant_badge: "Nữ · Medium"
      source_repo: "speaches-ai/piper-vi_VN-vais1000-medium"
