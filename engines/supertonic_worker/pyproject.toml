[project]
name = "omni-supertonic-worker"
version = "0.1.0"
description = "Isolated official Supertonic 3 ONNX worker for OMNI TTS."
requires-python = ">=3.10,<3.14"
dependencies = [
    "supertonic==1.3.1",
    "numpy>=1.26,<3",
    "soundfile>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false
