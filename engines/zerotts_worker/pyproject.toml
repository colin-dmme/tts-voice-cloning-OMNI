[project]
name = "omni-zerotts-worker"
version = "0.1.0"
description = "Isolated official ZeroTTS ONNX worker for Colin TTS Studio."
requires-python = ">=3.10,<3.14"
dependencies = [
    "zerotts==0.1.2",
    "numpy>=1.26,<3",
    "soundfile>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false
